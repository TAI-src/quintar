site_name: QUINT'R
site_url: https://tai-src.github.io/quintar/
theme:
  name: mkdocs
# Custom variables
extra:
  github_repo: https://github.com/TAI-src/quintar
  page_path: quintar/docs
markdown_extensions:
  - sane_lists
  - admonition
  - toc:
      permalink: true
  - md_in_html
  - pymdownx.tilde
plugins:
  - search
  - macros:
      module_name: main

